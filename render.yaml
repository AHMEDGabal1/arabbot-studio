# render.yaml — Render Blueprint (Infrastructure as Code)
# Commit this file to the root of your repository.
# Render reads it automatically when you click "New Blueprint Instance" in the dashboard.
# Docs: https://render.com/docs/blueprint-spec

services:
  # ─────────────────────────────────────────
  # Backend — FastAPI Web Service
  # ─────────────────────────────────────────
  - type: web
    name: arabbot-backend
    runtime: docker
    # Render builds the Dockerfile from the backend/ subdirectory
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: starter          # $7/mo (512MB RAM). Upgrade to standard for production load.
    region: frankfurt      # Choose region closest to your users (ohio, oregon, singapore, frankfurt)
    healthCheckPath: /health

    envVars:
      # Render auto-injects DATABASE_URL from the linked postgres service below
      - key: DATABASE_URL
        fromDatabase:
          name: arabbot-postgres
          property: connectionString
        # IMPORTANT: Render gives a postgres:// URL — we must use postgresql+asyncpg:// for SQLAlchemy async.
        # Override using a pre-deploy command instead (see note below).

      - key: REDIS_URL
        fromService:
          name: arabbot-redis
          type: redis
          property: connectionString

      - key: ENVIRONMENT
        value: production

      # All secrets below must be set in the Render dashboard → Environment tab
      # (or via Render's Secret Files / Secret Groups feature)
      - key: SECRET_KEY
        sync: false          # marks it as a secret — must be manually set in dashboard

      - key: GOOGLE_API_KEY
        sync: false

      - key: META_APP_ID
        sync: false

      - key: META_APP_SECRET
        sync: false

      - key: SUPABASE_URL
        sync: false

      - key: SUPABASE_ANON_KEY
        sync: false

      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      - key: SENTRY_DSN
        sync: false

      - key: GEMINI_MODEL_FAST
        value: gemini-2.0-flash-exp

      - key: GEMINI_MODEL_FULL
        value: gemini-2.5-pro

      - key: BASE_URL
        value: https://arabbot-backend.onrender.com   # Replace with your custom domain after setup

  # ─────────────────────────────────────────
  # Frontend — React Static Site
  # ─────────────────────────────────────────
  - type: static
    name: arabbot-frontend
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: arabbot-backend
          property: url

  # ─────────────────────────────────────────
  # Redis — Managed Redis (Render)
  # ─────────────────────────────────────────
  - type: redis
    name: arabbot-redis
    plan: free             # 25MB. Upgrade to starter ($10/mo) for persistence.
    region: frankfurt
    maxmemoryPolicy: allkeys-lru   # Evict least-recently-used keys when memory is full

databases:
  # ─────────────────────────────────────────
  # PostgreSQL — Managed Postgres (Render)
  # ─────────────────────────────────────────
  - name: arabbot-postgres
    plan: free             # 256MB / 90-day limit. Upgrade to starter ($7/mo) for production.
    region: frankfurt
    databaseName: arabbot
    user: arabbot_app
